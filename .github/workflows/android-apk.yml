name: Compilar AllSender APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # Permite compilar manualmente a qualquer momento

jobs:
  build:
    name: Compilar APK com Ícone
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código Fonte
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Garantir Permissões de Execução do Gradle
        run: chmod +x gradlew || true

      - name: Compilar APK (Debug / Release)
        run: ./gradlew assembleDebug

      - name: Publicar Release no GitHub com APK Anexado
        uses: softprops/action-gh-release@v1
        with:
          name: AllSender ${{ github.ref_name }}
          body: |
            ## AllSender - Lançamento Oficial
            - Ficheiro APK compilado automaticamente via GitHub Actions.
            - Inclui o ícone oficial do projeto e suporte offline para transferência de ficheiros.
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
