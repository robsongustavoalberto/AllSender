name: Compilar AllSender APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código Fonte
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Verificar ou Instalar Gradle Wrapper
        run: |
          if [ ! -f ./gradlew ]; then
            echo "gradlew não encontrado. Gerando Gradle Wrapper..."
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Compilar APK (Debug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload do APK como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: AllSender-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Anexar APK na Release do GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
