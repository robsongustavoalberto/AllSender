Summary: Fast, private file sharing over local Wi-Fi or hotspot
Description: |-
  Share files between phones and PCs on the same Wi-Fi or hotspot, with no internet.
  The phone runs a small web server; any browser can download files from it
  or upload files to the phone. QR code, access token, no trackers, no ads.
