plugins {
    id 'com.android.application'
    id 'com.chaquo.python' // Aplicação do plugin Chaquopy
}

android {
    namespace 'com.allsender.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.allsender.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Configuração das arquiteturas suportadas pelo Chaquopy
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }

        // Configurações do Python embarcado
        python {
            version "3.8" // Versão estável e leve para o ambiente Android
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}